notebook: notebooks/Graph.ipynb
software:
  - ast
  - io
  - json
  - numpy
  - pandas
  - pathlib
  - requests
datasets:
  - variable: df_filt
    tool: LiPDGraph
notes: |
  The LiPDGraph SPARQL results land in df_res (pd.read_csv of a requests.post
  response to linkedearth.graphdb.mint.isi.edu). The last code cell copies a
  filtered subset to df_filt (interpLabel == 'precipitation') and inspects it
  with head(). Judgment call: the notebook does no analysis beyond this
  inspection, but df_filt is the final DataFrame holding the queried data that
  is looked at, so per the "copied to a new name and only the new name is
  analyzed" rule I recorded df_filt rather than df_res. If inspection-only use
  is deemed insufficient for "scientific analysis", df_res would be the
  alternative answer.
  numpy, ast, and pathlib are imported but never used; they still count as
  imports. The notebook's first code cell is empty, and the long trailing cell
  about VS Code AI extensions is markdown, so its embedded snippets do not
  count. No %%-magic cells.
