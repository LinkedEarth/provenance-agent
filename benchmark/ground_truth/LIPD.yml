notebook: notebooks/testing/LIPD.ipynb
software:
  - pandas
  - pylipd
datasets:
  - variable: D_remote
    tool: PyLiPD
  - variable: D_url
    tool: PyLiPD
  - variable: D
    tool: PyLiPD
  - variable: D_dir
    tool: PyLiPD
  - variable: D_reloaded
    tool: PyLiPD
notes: |
  D_reloaded vs D_src: D_src loads MD98_2181.Stott.2007 and
  Ocn-MadangLagoonPapuaNewGuinea.Kuhnert.2001 remotely, but its Dataset objects
  are immediately extracted (dses = D_src.get_datasets()) and reloaded into
  D_reloaded via load_datasets(). D_reloaded is the final LiPD object holding
  that data, so it is listed as the terminal variable instead of D_src; neither
  is analyzed beyond printing dataset names, which is a judgment call.
  D_remote (Ocn-RedSea.Felis.2000) is only inspected via get_all_dataset_names()
  and type(); kept because it is a genuine remote load and the notebook's own
  markdown says Felis.2000 should be cited.
  D loads a local .lpd file (Ocn-Palmyra.Nurhati.2011.lpd); local LiPD files
  still count as external dataset sources under the PyLiPD load() pattern.
  Derived DataFrames (df, df_cut, df_essential, df_dir, df_temp, df_filt,
  df_local, df_pages2k, df_merged) are excluded: they are extracted/merged
  views, not LiPD objects. The df_merged concat means D and D_dir both contain
  Nurhati.2011 (intentional deduplication test), but the terminal dataset
  variables remain D and D_dir.
