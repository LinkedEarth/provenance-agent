notebook: notebooks/demos/paleoPCAlite.ipynb
software:
  - ast
  - cartopy
  - io
  - json
  - matplotlib
  - numpy
  - pandas
  - pathlib
  - pyleoclim
  - requests
datasets:
  - variable: filtered_df2
    tool: LiPDGraph
notes: |
  The LiPDGraph SPARQL results land in df_res (pd.read_csv of a requests.post
  response to linkedearth.graphdb.mint.isi.edu), then flow through a chain of
  filtered copies: df -> filtered_df -> filt_df -> filtered_df2. Only
  filtered_df2 is iterated to build the pyleoclim GeoSeries used for the PCA
  analysis, so per the "copied to a new name and only the new name is analyzed"
  rule the terminal dataset variable is filtered_df2 (still a DataFrame), not
  df_res. The downstream mgs/mgs_common/pca objects are pyleoclim conversions
  and derived results, so they are excluded.
  The software list follows the current executable import cells: ast, cartopy,
  io, json, matplotlib, numpy, pandas, pathlib, pyleoclim, and requests.
  eofs, fsspec, glob, nc_time_axis, s3fs, and xarray occur in the prose or
  reference material but are not imported by this lite notebook, so they are
  not listed. The generated provenance cells are excluded from software
  extraction; they are outputs of this repository rather than notebook
  dependencies. This notebook has no %%-magic cells.
