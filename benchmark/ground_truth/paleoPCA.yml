notebook: notebooks/testing/paleoPCA.ipynb
software:
  - ast
  - cartopy
  - eofs
  - fsspec
  - glob
  - io
  - json
  - matplotlib
  - nc_time_axis
  - numpy
  - pandas
  - pathlib
  - pyleoclim
  - requests
  - s3fs
  - xarray
datasets:
  - variable: filtered_df2
    tool: LiPDGraph
  - variable: ds_geo
    tool: xarray
notes: |
  Proxy side: the LiPDGraph SPARQL results land in df_res (pd.read_csv of a
  requests.post response to linkedearth.graphdb.mint.isi.edu), then flow
  through filtered copies df -> filtered_df -> filt_df -> filtered_df2. Only
  filtered_df2 feeds the pyleoclim GeoSeries construction and later the
  model-data comparison scatter, so it is the terminal DataFrame, not df_res.

  Model side: the CESM LME output is loaded in a try/except cell. The try
  branch streams NetCDF files from JetStream2 via fsspec's s3 filesystem and
  xr.open_dataset, accumulating variables into ds and slicing to ds_geo_all;
  the except branch downloads a pre-computed file from Figshare via requests
  and opens it with xr.open_dataset into ds_geo_all. Either way the data then
  flows ds_geo_all -> ds_geo_time -> ds_geo (sel + resample, still an
  xarray.Dataset). ds_geo is the terminal dataset variable: d18Op/d18Oa and
  the Eof solver outputs are derived DataArrays/computations, so they are
  excluded. Judgment call: I labeled the tool "xarray" (xr.open_dataset is the
  actual loader in both branches) rather than "fsspec" or "requests", which
  only provide transport.

  The %%time cell (precipitation d18O calculation) is skipped for import
  extraction per the %% rule, but it contains no imports anyway. The output
  shown in the notebook indicates the except (Figshare) branch was the one
  actually executed in the saved run.
