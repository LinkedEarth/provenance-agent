notebook: notebooks/testing/PyleoTUPS.ipynb
software:
  - pyleotups
datasets:
  - variable: ds
    tool: PyleoTUPS
  - variable: ds2
    tool: PyleoTUPS
  - variable: ds_sum
    tool: PyleoTUPS
  - variable: noaa_ds
    tool: PyleoTUPS
  - variable: pangaea_ds
    tool: PyleoTUPS
notes: |
  ds3 (NOAA 36778) is merged into ds_sum (ds_sum = ds2 + ds3) immediately after
  loading and never used on its own, so ds_sum is listed as the terminal holder
  of that data instead of ds3. ds2 (NOAA 33213) is still listed separately
  because get_publications() is called directly on it before the merge and it
  keeps holding its data afterwards; this means the 33213 data is technically
  reachable through both ds2 and ds_sum.
  ds_sum, noaa_ds, and pangaea_ds are never analyzed after their
  search/merge step; they are kept because they are genuine
  PangaeaDataset/NOAADataset source objects holding externally queried data,
  which is the pattern the detector must find - a judgment call given the
  "actually used for analysis" criterion.
  res, res3, and results hold the return values of search_studies() (search
  result tables), not dataset objects of the source type, so the terminal
  variables are the dataset objects themselves. results is also overwritten by
  the second advanced search.
