## Maps each library to its paper citation and software citation file.
## Paper citations are inlined as BibTeX; software citations reference .bib files.
## Not all libraries have both citation types.

pandas:
  paper: |
    @InProceedings{mckinney2010data,
      author    = {Wes McKinney},
      title     = {Data Structures for Statistical Computing in Python},
      booktitle = {Proceedings of the 9th Python in Science Conference},
      pages     = {56--61},
      year      = {2010},
      editor    = {St\'efan van der Walt and Jarrod Millman},
      doi       = {10.25080/Majora-92bf1922-00a}
    }
  software: pandas.bib

