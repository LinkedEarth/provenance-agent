[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "nbformat",
  "bibtexparser",
  "PyYAML",
  "pandas",
  "requests",
  "python-dotenv",
  "langchain-core",
  "pydantic",
  "ipython",
  "ipynbname",
]

[project.optional-dependencies]
data = [
  "pylipd",
  "pyleotups",
]
dev = [
  "pytest",
]
# One extra per entry in provenance_agent.llm.PROVIDERS, including the default
# provider. No LLM integration is a core dependency: each is imported lazily and
# is only needed when PROVENANCE_LLM_PROVIDER selects it, so nobody installs a
# provider they will not use. A core install therefore has no provider at all,
# and build_llm() raises the exact `pip install` command for the one selected.
google = [
  "langchain-google-genai",
]
openai = [
  "langchain-openai",
]
anthropic = [
  "langchain-anthropic",
]
ollama = [
  "langchain-ollama",
]
xai = [
  "langchain-xai",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["provenance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provenance_agent = ["Citations/**/*"]
